
name: Build Vitro De

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Vitro Sample
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found!"
            exit 1
          fi

          echo "Android SDK found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Show Gradle projects
        run: ./gradlew projects --no-daemon

      - name: Build Sample APK
        run: |
          ./gradlew :sample:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find sample/build/outputs \
            -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitro-Demo-APK
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
